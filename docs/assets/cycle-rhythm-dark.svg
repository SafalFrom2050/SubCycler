<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" width="960" height="304" role="img" aria-label="90-day comparison of Standard Auto-Renew, SubCycler 45-Day Rotation, and Paired Swap 30d/30d">
  <defs>
