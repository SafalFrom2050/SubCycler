    <rect x="802" y="148" width="114" height="38" fill="url(#cycleHatch)"/>
  </g>
  <rect x="827" y="157" width="64" height="20" rx="10" fill="rgba(255,255,255,0.92)"/>
  <text x="859" y="171" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="11" font-weight="700" fill="#4C5853">15d off</text>

  <!-- Row 3: Paired Swap 30d / 30d (True-Hue Brand Blocks + Botanical Baton Divider) -->
  <rect x="24" y="210" width="912" height="70" rx="20" fill="#FFFFFF" stroke="#E2E8E5" stroke-width="1"/>
  <text x="42" y="241" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="16" font-weight="700" fill="#141917">Paired Swap (30d / 30d)</text>
  <text x="42" y="262" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#186445">1 active at a time · save 50%</text>

  <rect x="260" y="228" width="210" height="34" rx="13" fill="#2554EB"/>
  <text x="365" y="249" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Service A · 30d active</text>
  <line x1="476" y1="224" x2="476" y2="266" stroke="#186445" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="482" y="228" width="208" height="34" rx="13" fill="#C62828"/>
  <text x="586" y="249" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Service B · 30d active</text>
  <line x1="696" y1="224" x2="696" y2="266" stroke="#186445" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="702" y="228" width="214" height="34" rx="13" fill="#2554EB"/>
  <text x="809" y="249" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Service A · 30d active</text>
</svg>
