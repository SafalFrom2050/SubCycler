<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 308" width="960" height="308" role="img" aria-label="90-day comparison of Standard Auto-Renew, SubCycler 45-Day Rotation, and Paired Swap 30d/30d">
  <defs>
    <pattern id="cycleHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#64748B" stroke-width="2.4" stroke-opacity="0.34"/>
    </pattern>
    <clipPath id="b1"><rect x="478" y="148" width="104" height="38" rx="14"/></clipPath>
    <clipPath id="b2"><rect x="802" y="148" width="114" height="38" rx="14"/></clipPath>
  </defs>

  <rect x="4" y="4" width="952" height="300" rx="28" fill="#F5F7F6" stroke="#DDE4E0" stroke-width="1.5"/>

  <!-- Column scale header -->
  <g font-family="'Google Sans Flex', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5A6661">
    <text x="34" y="40">90-DAY BILLING CADENCE</text>
    <text x="260" y="40">DAY 1</text>
    <text x="476" y="40">DAY 30</text>
    <text x="696" y="40">DAY 60</text>
    <text x="916" y="40" text-anchor="end">DAY 90</text>
  </g>

  <!-- Row 1: Standard Auto-Renew -->
  <rect x="24" y="56" width="912" height="70" rx="20" fill="#FFFFFF" stroke="#E2E8E5" stroke-width="1"/>
  <text x="42" y="87" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="16" font-weight="700" fill="#141917">Standard auto-renew</text>
  <text x="42" y="108" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="500" fill="#5A6661">12 billings / yr · continuous</text>

  <g font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#4C5853">
    <rect x="260" y="74" width="212" height="34" rx="13" fill="#E8ECEA"/>
    <text x="366" y="95" text-anchor="middle">30d paid</text>
    <rect x="480" y="74" width="212" height="34" rx="13" fill="#E8ECEA"/>
    <text x="586" y="95" text-anchor="middle">30d paid</text>
    <rect x="700" y="74" width="216" height="34" rx="13" fill="#E8ECEA"/>
    <text x="808" y="95" text-anchor="middle">30d paid</text>
  </g>

