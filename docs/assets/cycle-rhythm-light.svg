  <rect x="24" y="133" width="912" height="70" rx="20" fill="#FFFFFF" stroke="#186445" stroke-opacity="0.35" stroke-width="1.2"/>
  <text x="42" y="164" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="16" font-weight="700" fill="#141917">SubCycler 45-day</text>
  <text x="42" y="185" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#186445">8 billings / yr · save 33.3%</text>

  <rect x="260" y="148" width="210" height="38" rx="14" fill="#186445"/>
  <text x="365" y="168" text-anchor="middle" font-family="'Google Sans Flex', 'Google Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">30d active</text>
